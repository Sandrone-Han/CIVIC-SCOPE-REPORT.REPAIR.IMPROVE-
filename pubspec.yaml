name: civic_scope
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies: # Dependencies specify other packages that your package needs in order to work. To automatically upgrade your package dependencies to the latest versions consider running `flutter pub upgrade --major-versions`. Alternatively, dependencies can be manually updated by changing the version numbers below to the latest version available on pub.dev. To see which dependencies have newer versions available, run `flutter pub outdated`.
  flutter:
    sdk: flutter

  cupertino_icons: # The following adds the Cupertino Icons font to your application. Use with the CupertinoIcons class for iOS style icons.
  flutter_riverpod:
  flutter_hooks:          # Local state management with hooks
  hooks_riverpod:         # Combines flutter_hooks with riverpod
  shared_preferences:     # For the app to remember states
  flex_color_scheme:
  go_router:
  riverpod_annotation:
  freezed_annotation:
  json_annotation:

  geocoding: any
  http: ^1.2.2


  firebase_core: ^4.5.0   # For backend
  firebase_auth: ^6.2.0   # For backend
  cloud_firestore: ^6.1.3 # For backend
  firebase_storage:       # For backend
  uuid:                   # For backend

  google_maps_flutter: ^2.15.0
  camera: ^0.12.0
  path_provider: ^2.1.5
  path: ^1.9.1
  location: ^8.0.1
  flutter_svg: ^2.0.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
     sdk: flutter
  mockito: ^5.4.0
  build_runner: ^2.4.0  
  flutter_lints: ^6.0.0 # The "flutter_lints" package below contains a set of recommended lints to encourage good coding practices. The lint set provided by the package is activated in the `analysis_options.yaml` file located at the root of your package. See that file for information about deactivating specific lint rules and activating additional ones.
  flutter_launcher_icons: # Use "dart run flutter_launcher_icons" to generate the icons
  rename_app: ^1.6.5 # Use 'dart run rename_app:main all="Civic Scope"' to rename it to "Civic Scope"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true # So that Material Icons font is included
  assets:
    - assets/

# Use "dart run flutter_launcher_icons" to generate the icons
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  linux:
    generate: true
    image_path: "assets/app_icon.png"
  image_path: "assets/app_icon.png"